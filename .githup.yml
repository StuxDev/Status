# Stux.Dev Status: https://status.stux.dev
# Asks GitHub for a check every 5 minutes (best-effort; GitHub often runs it less often) - .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: Stux.Dev Status
  description: Live status of Stux.Dev's website, services and Labs, checked regularly.
  # Its own badge icon (the Stux.Dev mark with a heartbeat badge), as on services.stux.dev.
  logo: https://services.stux.dev/assets/img/services/stux-dev-status.png
  favicon: https://services.stux.dev/assets/img/services/stux-dev-status.png
  accent: "#fd6602"
  url: https://status.stux.dev/
  footer_links:
    - label: Stux.Dev
      url: https://stux.dev/
    - label: Report a problem
      url: https://github.com/StuxDev/Status/issues/new

legal:
  operator: Stux.Dev
  company: "Stux.Dev is operated by Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 124 City Road, London, EC1V 2NX, England, United Kingdom."
  contact: legal@stux.dev
  host: GitHub Pages
  effective: 30 September 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Ungrouped monitors are listed first.
monitors:
  - name: Stux.Dev
    url: https://stux.dev/
    description: The Stux.Dev website
  - name: Stux.Dev Services
    url: https://services.stux.dev/
    description: The directory of every Stux.Dev service, tool and template
  - name: Stux.Dev Media CDN
    url: https://global.media.stux.dev/icon.png
    description: Shared logos and images used across every Stux.Dev site

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
groups:
  - name: Services
    description: Stux.Dev's free tools. No ads, no accounts, no trackers.
    monitors:
      - name: Stuxs.Tools
        url: https://stuxs.tools/
        description: Free web tools for everyone
      # The app's health check: 200 when yt-dlp, storage and PHP are all OK, 503 when one fails.
      - name: Downl.one
        url: https://downl.one/api/health.php
        description: Download anything, no signup
      - name: Sm.lol
        url: https://sm.lol/
        description: Short links, bio pages, QR codes and more
      # tiny1 (Sm.lol's server) writes this file daily while every certificate it uses has more
      # than 21 days left, and removes it when one doesn't (/usr/local/sbin/cert-expiry-check).
      - name: Sm.lol Certificates
        url: https://tiny1.servers.uk.stuxedo.net/certificates-ok.txt
        description: Every certificate on Sm.lol's server has more than 21 days left

  - name: Labs
    description: Smaller, experimental projects from Stux.Dev Labs.
    monitors:
      - name: Stux.Dev Labs
        url: https://labs.stux.dev/
        description: The registry of every Labs experiment
      - name: AutoScroll
        url: https://autoscroll.stux.dev/
        description: A clean, auto-scrolling image gallery for Reddit

  - name: Templates
    description: The page templates and the GitHub Pages redirect, each with a live preview.
    monitors:
      - name: Stux.Dev Soonpage
        url: https://soonpage.stux.dev/
        description: The coming-soon page template
      - name: Stux.Dev Maintenancepage
        url: https://maintenancepage.stux.dev/
        description: The maintenance page template
      - name: Stux.Dev Servicepage
        url: https://servicepage.stux.dev/
        description: The placeholder page for services not set up yet
      - name: Stux.Dev GitHub Pages Redirect
        url: https://stuxdev.github.io/
        description: Sends stuxdev.github.io to Stux.Dev's GitHub profile

incidents:
  labels: [status]
